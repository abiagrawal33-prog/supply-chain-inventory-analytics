name: supply_chain_analytics
version: "1.0.0"
config-version: 2
profile: supply_chain_analytics

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  stockout_fill_rate_threshold: 0.85   # shipments below this fill rate count as a DC short-ship
  forecast_undercall_ratio: 0.75       # forecast < 75% of demand counts as a forecast miss
  persistent_bias_ratio: 0.90          # trailing 4-wk forecast/demand below this = persistent under-forecast
  low_safety_stock_weeks: 0.10

models:
  supply_chain_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
